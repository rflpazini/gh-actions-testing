# lib-kvetch-gen-go: Code generated by go generate; DO NOT EDIT!
name: Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  versions-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PKG_REPO_TOKEN }}

      - name: Extract appVersion and Helm version
        run: |
          CHART_FILE=$(find deploy/helm -type f -path "*/v2/*/Chart.yaml" -print -quit)
          if [ -z "$CHART_FILE" ]; then
              CHART_FILE=$(find deploy/helm -type f -path "*/Chart.yaml" -print -quit)
          fi
          echo "$CHART_FILE"
          echo "APP_VERSION=$(yq e '.appVersion' $CHART_FILE)" >> $GITHUB_ENV
          echo "HELM_VERSION=$(yq e '.version' $CHART_FILE)" >> $GITHUB_ENV

      - name: Extract lib-observability-go version from go.mod
        run: |
          echo "OBSERVABILITY_VERSION=$(grep 'github.com/Pluto-tv/lib-observability-go/v2' go.mod | awk '{print $2}')" >> $GITHUB_ENV

      - name: Generate labels
        run: |
          cat << EOF > .github/labeler.yml
          "release: ${{ env.APP_VERSION }}":
            - changed-files:
              - any-glob-to-any-file: '**'
          "chart: ${{ env.HELM_VERSION }}":
            - base-branch: 'main'
          "observability: ${{ env.OBSERVABILITY_VERSION }}":
            - changed-files:
              - any-glob-to-any-file: '**'
          EOF

      - name: Run Labeler
        uses: actions/labeler@v5

      - name: Remove Oldest and Unused Labels from PR
        run: |
          # Get all labels on the current pull request
          pr_labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name')

          echo "Labels on the PR: $pr_labels"

          # Identify and remove the oldest "release:" label
          release_labels=$(echo "$pr_labels" | grep '^release:' || true)
          if [ -n "$release_labels" ]; then
            oldest_release=$(echo "$release_labels" | head -n 1)
            echo "Removing oldest release label: $oldest_release"
            gh pr edit ${{ github.event.pull_request.number }} --remove-label "$oldest_release"
          fi

          # Identify and remove any "chart:" labels
          chart_labels=$(echo "$pr_labels" | grep '^chart:' || true)
          if [ -n "$chart_labels" ]; then
            echo "Removing chart labels: $chart_labels"
            while IFS= read -r chart_label; do
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "$chart_label"
            done <<< "$chart_labels"
          fi

          # Identify and remove any "observability:" labels
          observability_labels=$(echo "$pr_labels" | grep '^observability:' || true)
          if [ -n "$observability_labels" ]; then
            echo "Removing observability labels: $observability_labels"
            while IFS= read -r observability_label; do
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "$observability_label"
            done <<< "$observability_labels"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Label Colors
        run: |
          get_label_color() {
            local label="$1"
            if [[ "$label" == release:* ]]; then
              echo "FBCA04" # Yellow for release-related labels
            elif [[ "$label" == chart:* ]]; then
              echo "1D76DB" # Blue for chart-related labels
            elif [[ "$label" == observability:* ]]; then
              echo "0E8A16" # Green for observability-related labels
            fi
          }

          labels=$(gh label list --json name --jq '.[].name')
          
          while IFS= read -r label; do
            color=$(get_label_color "$label")
            gh label edit "$label" --color "$color" || \
            echo "Failed to update color for label: $label"
          done <<< "$labels"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
